version: '3.8'

services:
  civitai-monitor:
    build: .
    container_name: civitai-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./civitai_cookies.txt:/app/civitai_cookies.txt:ro
      - ./seen_ids:/app/seen_ids
      - ./downloads:/app/downloads
      - ./monitor.log:/app/monitor.log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30m
      timeout: 5s
      retries: 2
      start_period: 10s