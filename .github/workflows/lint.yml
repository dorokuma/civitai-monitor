name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install ruff
        # Pinned: CI installs latest ruff, and new ruff releases add default
        # rules that break lint without any code change. Bump deliberately
        # (after satisfying any new findings), not automatically.
        run: pip install ruff==0.16.7

      - name: Run ruff
        run: ruff check .
