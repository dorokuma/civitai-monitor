name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly scan: Monday 04:17 UTC (off the hour to avoid runner crunch).
    - cron: "17 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        # SHA-pinned: v3 is a moving tag, so pin the commit it currently
        # points at and bump deliberately (same policy as ruff in lint.yml).
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
