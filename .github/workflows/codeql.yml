name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly scan: Monday 04:17 UTC (off the hour to avoid runner crunch).
    - cron: "17 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        # SHA-pinned: v3 is a moving tag, so pin the commit it currently
        # points at and bump deliberately (same policy as ruff in lint.yml).
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
